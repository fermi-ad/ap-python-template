[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_python_starter_kit"]

[project]
name = "ap-python-starter-kit"
version = "0.1.0"
description = "Python starter kit"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Template Maintainers" }]
dependencies = ["acsys", "acsys[settings]"]

[project.optional-dependencies]
gui-pyqt = ["PyQt6~=6.10"]

[project.scripts]
ap-python-starter-kit = "ap_python_starter_kit.main:main"

[dependency-groups]
dev = [
    "pytest~=9.0",
    "ruff~=0.15",
    "pre-commit~=4.5",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
# Pull from git, matching the reference container example.
acsys = { git = "https://github.com/fermi-ad/acsys-python", rev = "v0.12.9" }

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[[tool.pyright.executionEnvironments]]
root = "src"
extraPaths = ["src"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
