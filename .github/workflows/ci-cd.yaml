name: Continuous Integration & Continuous Delivery

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

env:
  # The list of files and directories to exclude from code coverage analysis, separated by pipe ('|') characters. This typically includes:
  # - The 'tests' directory (contains test code, not application code)
  # - The 'docs' directory (contains documentation, not application code)
  # - The 'examples' directory (contains example code, not application code)
  # If the code coverage step throws an error, be sure to check that files are not being excluded here that get seen by the coverage tool.
  COV_EXCLUDE: 'tests/|docs/|examples/'
  
  # Determines the container image variant to build and deploy. 'gui-xpra' builds a deployment with GUI support, while 'cli' builds a deployment without GUI support.
  IMAGE_VARIANT: gui-xpra
  
  # A space-separated list of system packages to install on the GitHub Action host machine. This is useful for installing
  # OS-level dependencies that your application relies on.
  # For example, the acsys python package requires the 'libkrb5-dev' (Kerberos) package to be installed.
  SYSTEM_PACKAGES: libkrb5-dev
  

jobs:
  setup: # This job is used to translate the local environment variables into outputs that can be used by other jobs. It runs first and both the integration and delivery jobs depend on it.
    runs-on: ubuntu-latest
    outputs:
      cov_exclude: ${{ steps.setup.outputs.COV_EXCLUDE }}
      image_variant: ${{ steps.setup.outputs.IMAGE_VARIANT }}
      system_packages: ${{ steps.setup.outputs.SYSTEM_PACKAGES }}
    steps:
      - name: Setup Step
        id: setup
        run: |
          echo "COV_EXCLUDE=$COV_EXCLUDE" >> $GITHUB_OUTPUT
          echo "IMAGE_VARIANT=$IMAGE_VARIANT" >> $GITHUB_OUTPUT
          echo "SYSTEM_PACKAGES=$SYSTEM_PACKAGES" >> $GITHUB_OUTPUT

  check-renamed:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - name: Verify rename script has been run
        # The template repo (fermi-ad/ap-python-template) is allowed to keep the placeholder name.
        # Any repo created from the template must run scripts/rename_project.py before pushing an image.
        if: github.repository != 'fermi-ad/ap-python-template'
        run: |
          if grep -q "ap-python-starter-kit" pyproject.toml; then
            echo "ERROR: This repository still contains template placeholder names."
            echo "Please run 'python3 scripts/rename_project.py' and commit the result before pushing."
            exit 1
          fi

  integration:
    needs: setup
    uses: fermi-ad/.github/.github/workflows/ap-python-integration.yaml@main
    secrets: inherit
    permissions:
      contents: write # Allows coverage report to be attached to the commit status (push to main)
      pull-requests: write # Allows coverage report to be added as a comment to the pull request
    with:
      coverage-exclude: ${{ needs.setup.outputs.cov_exclude }}
      static-dependencies: ${{ needs.setup.outputs.system_packages }}

  delivery:
    needs: [ setup, integration, check-renamed ]
    # Only deploys on pushes to main, not on pull request events. Also skips the first run of the workflow, which gets triggered when the new repository is created from the template.
    if: github.run_number != 1 && github.event_name == 'push'
    uses: fermi-ad/.github/.github/workflows/ap-python-deployment.yaml@main
    secrets: inherit
    with:
      image-variant: ${{ needs.setup.outputs.image_variant }}