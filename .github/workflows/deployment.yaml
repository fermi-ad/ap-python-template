name: Continuous Delivery Workflow for AP Python applications

on:
  workflow_dispatch:
    inputs:
      pull-git-submodules:
        description: 'Indicates whether this repository has Git submodules to pull.'
        required: false
        type: boolean
        default: false

      image-variant:
        description: 'Which container image variant to build and deploy.'
        required: false
        type: choice
        default: cli
        options:
          - cli
          - gui-xpra

  workflow_call:
    inputs:
      pull-git-submodules:
        required: false
        type: boolean
        default: false
        description: 'Indicates whether this repository has Git submodules to pull.'

      image-variant:
        required: false
        type: string
        default: cli
        description: 'Which container image variant to build and deploy (cli or gui-xpra).'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Build-Dockerize-Push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checking out source code
        uses: actions/checkout@v6
        with:
          submodules: ${{ (inputs.pull-git-submodules || github.event.inputs.pull-git-submodules == 'true') && 'recursive' || 'false' }}

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ACTION_SETTINGS_APP_ID }}
          private-key: ${{ secrets.ACTION_SETTINGS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Git for private repo access
        run: |
          git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: adregistry.fnal.gov/ap-python/${{ github.event.repository.name }}
          flavor: |
            suffix=-${{ inputs.image-variant || github.event.inputs.image-variant || 'cli' }}
          tags: |
            # This is the default tag for the last commit of the default branch
            type=edge
            # This sets the latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.run_number }},enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to AD Registry, Harbor
        uses: docker/login-action@v4
        with:
          registry: adregistry.fnal.gov
          username: ${{ secrets.ADREGISTRY_AP_USERNAME }}
          password: ${{ secrets.ADREGISTRY_AP_SECRET }}

      - name: Building Docker image and pushing to adregistry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Build the correct Dockerfile target based on the selected image variant.
          target: ${{ (inputs.image-variant || github.event.inputs.image-variant || 'cli') == 'gui-xpra' && 'xpra-runtime' || 'runtime' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
