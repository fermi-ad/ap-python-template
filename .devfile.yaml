schemaVersion: 2.2.2
metadata:
  name: ap-python-template
  version: 0.1.0
  displayName: AP Python Template
  description: Python-first template (uv + pytest + ruff) with optional container workflow.
  tags:
    - python
    - uv
    - pytest
    - ruff
  language: python

components:
  - name: tools
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
      cpuLimit: "2"
      memoryLimit: 4Gi
      mountSources: true
      env:
        - name: UV_LINK_MODE
          value: copy
        - name: UV_CACHE_DIR
          value: /home/user/.cache/uv
        - name: PIP_DISABLE_PIP_VERSION_CHECK
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
      endpoints:
        - name: docs
          targetPort: 8000
          protocol: http
          exposure: public

commands:
  - id: uv-sync
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: uv sync
      group:
        kind: build
        isDefault: true

  - id: test
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: uv run pytest
      group:
        kind: test
        isDefault: true

  - id: lint
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: uv run ruff check .
      group:
        kind: test

  - id: format
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: uv run ruff format .
      group:
        kind: test

  - id: run
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: uv run __template-module__
      group:
        kind: run
        isDefault: true
 
  - id: rename-project
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: python3 scripts/rename_project.py
      group:
        kind: run
 
  - id: docs-serve
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: python -m http.server 8000 --directory docs
      group:
        kind: run
